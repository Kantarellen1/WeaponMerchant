<!DOCTYPE html>
<html>
<head>
    <title>Elara's Apothecary - Potions & Herbs</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #2E8B57 0%, #3CB371 100%);
            color: white;
        }
        .apothecary-container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px;
            background: rgba(0,0,0,0.3);
            min-height: 100vh;
        }
        .apothecary-header { 
            text-align: center; 
            margin-bottom: 30px;
            background: rgba(46,139,87,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .bubble-sound { 
            background: #e1f5fe; 
            padding: 5px 10px; 
            border-radius: 5px; 
            font-size: 12px; 
            color: #333;
            margin: 5px 0;
        }
        .chat-box { 
            border: 3px solid #228B22; 
            padding: 20px; 
            margin: 20px 0; 
            height: 400px; 
            overflow-y: scroll; 
            background: rgba(240,248,255,0.95);
            color: #333;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(46,139,87,0.3);
        }
        .message { 
            margin: 10px 0; 
            padding: 8px; 
            border-radius: 5px; 
        }
        .you { 
            color: #000080; 
            background: #e6f3ff; 
            border-left: 4px solid #4169E1;
        }
        .merchant { 
            color: #2E8B57; 
            background: #f0fff0; 
            font-weight: bold; 
            border-left: 4px solid #2E8B57;
        }
        .system { 
            color: #666; 
            font-style: italic; 
            background: #f5f5f5;
            border-left: 4px solid #999;
        }
        .apothecary { 
            color: #8B4513; 
            background: #fff8dc; 
            font-size: 12px;
            text-align: center;
            border: 1px dashed #2E8B57;
        }
        .input-area { 
            display: flex; 
            gap: 10px; 
            margin-top: 10px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 12px; 
            font-size: 16px; 
            border: 3px solid #228B22; 
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
        }
        button { 
            padding: 12px 20px; 
            font-size: 16px; 
            background: #228B22; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { 
            background: #32CD32; 
        }
        .leave-btn {
            background: #8B4513;
        }
        .leave-btn:hover {
            background: #A0522D;
        }
        .purchase-panel {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 20px 0;
            padding: 16px;
            border: 2px solid #2E8B57;
            border-radius: 8px;
            background: rgba(240,248,255,0.96);
            color: #333;
        }
        .purchase-details { display: grid; gap: 4px; }
        .purchase-details strong { color: #2E8B57; }
        .purchase-button { padding: 10px 16px; background: #228B22; color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .purchase-button:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="apothecary-container">
        <div class="apothecary-header">
            <h1>🧪 Elara's Apothecary 🧪</h1>
            <p>*The air is thick with the scent of herbs and bubbling potions*</p>
            <p>"Knowledge and healing, in equal measure..."</p>
        </div>
        
        <div class="bubble-sound">💨 *Bubble bubble* The cauldrons never rest... 🌿</div>
        
        <div class="chat-box" id="chatBox"></div>

        <div class="purchase-panel" id="purchasePanel">
            <div class="purchase-details">
                <strong id="purchaseItemName"></strong>
                <span id="purchasePrice"></span>
                <span id="purchaseGold"></span>
                <span id="purchaseStatus"></span>
            </div>
            <button class="purchase-button" id="purchaseButton" onclick="buySelectedItem()">Buy</button>
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Speak to Elara..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Talk</button>
            <button class="leave-btn" onclick="window.location.href='/town'">Leave Apothecary</button>
        </div>
    </div>

    <script>
        let playerId = null;
        const merchantId = 'elara';
        const sessionKey = 'weapon_merchant_session';
        let selectedItemKey = null;
        const itemAliases = [
            { key: 'healing_potion', name: 'Healing potion', terms: ['healing potion', 'health potion', 'healing'] },
            { key: 'mana_potion', name: 'Mana potion', terms: ['mana potion', 'mana'] }
        ];

        async function ensurePlayer() {
            const token = localStorage.getItem(sessionKey);
            if (!token) { location.href = '/login'; return false; }
            const res = await fetch(`/player/profile?session_token=${encodeURIComponent(token)}`);
            const data = await res.json();
            if (!res.ok || !data.player_id) { localStorage.removeItem(sessionKey); location.href = '/login'; return false; }
            playerId = data.player_id;
            addMessage('System', `You are logged in as ${playerId}.`);
            return true;
        }
        
        // Apothecary ambient sounds
        const ambientSounds = [
            '💨 *Bubble bubble* A green potion simmers...',
            '🌿 *Grinding* Elara crushes dried herbs...',
            '⚗️ *Hiss* Steam escapes from a distilling flask...',
            '🧪 *Clink* Glass vials gently touch each other...',
            '🍃 *Rustle* Herbs are sorted on wooden shelves...',
            '💧 *Drip drop* A mysterious liquid slowly drips...'
        ];

        function addMessage(sender, message) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender.toLowerCase().replace(' ', '-');
            
            if (sender === 'Merchant') {
                messageDiv.innerHTML = `<strong>🧙‍♀️ Elara:</strong> ${message}`;
            } else if (sender === 'Apothecary') {
                messageDiv.innerHTML = message;
            } else {
                messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            }
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function findRequestedItem(message) {
            const normalized = message.toLowerCase();
            return itemAliases.find(item => item.terms.some(term => normalized.includes(term)));
        }

        async function showPurchasePanel(item) {
            selectedItemKey = item.key;
            const panel = document.getElementById('purchasePanel');
            const button = document.getElementById('purchaseButton');
            document.getElementById('purchaseItemName').textContent = item.name;
            document.getElementById('purchasePrice').textContent = 'Checking price...';
            document.getElementById('purchaseGold').textContent = '';
            document.getElementById('purchaseStatus').textContent = '';
            button.disabled = true;
            panel.style.display = 'flex';
            const response = await fetch('/merchant/quote', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_token: localStorage.getItem(sessionKey), merchant_id: merchantId, item_key: item.key, quantity: 1, town: 'Buglia' })
            });
            const quote = await response.json();
            if (quote.error || quote.message) {
                document.getElementById('purchaseStatus').textContent = quote.error || quote.message;
                return;
            }
            document.getElementById('purchasePrice').textContent = `${quote.unit_price} gold`;
            document.getElementById('purchaseGold').textContent = `You have ${quote.player_gold} gold`;
            button.disabled = !quote.affordable;
            if (!quote.affordable) document.getElementById('purchaseStatus').textContent = 'Not enough gold.';
        }

        async function buySelectedItem() {
            if (!selectedItemKey) return;
            const button = document.getElementById('purchaseButton');
            const status = document.getElementById('purchaseStatus');
            button.disabled = true;
            status.textContent = 'Completing purchase...';
            const response = await fetch('/merchant/buy', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_token: localStorage.getItem(sessionKey), merchant_id: merchantId, item_key: selectedItemKey, quantity: 1, town: 'Buglia' })
            });
            const result = await response.json();
            status.textContent = result.message;
            if (result.purchase) document.getElementById('purchaseGold').textContent = `You have ${result.gold} gold`;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            const requestedItem = findRequestedItem(message);

            addMessage('You', message);
            input.value = '';

            try {
                const token = localStorage.getItem(sessionKey);
                const response = await fetch("/talk_to_merchant", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                            player_id: playerId,
                            session_token: token,
                            message: message,
                            player_location: "Buglia",
                            shop_type: "apothecary"
                        })
                });
                
                const data = await response.json();
                addMessage('Merchant', data.response);
                if (requestedItem) showPurchasePanel(requestedItem);
                
                // Add ambient apothecary sounds occasionally
                if (Math.random() < 0.4) {
                    setTimeout(() => {
                        const randomSound = ambientSounds[Math.floor(Math.random() * ambientSounds.length)];
                        addMessage('Apothecary', randomSound);
                    }, 1500 + Math.random() * 2000); // Random delay between 1.5-3.5 seconds
                }
                
                // Special potion brewing effect for certain keywords
                if (message.toLowerCase().includes('potion') || message.toLowerCase().includes('brew')) {
                    setTimeout(() => {
                        addMessage('Apothecary', '🔮 *A nearby cauldron glows brighter as if responding to your words...*');
                    }, 3000);
                }
                
            } catch (error) {
                addMessage('System', 'Error: ' + error.message);
            }
        }

        // Initialize with atmospheric entry
        window.onload = function() {
            setTimeout(() => {
                addMessage('System', 'You push open the heavy wooden door and step into the mystical apothecary...');
            }, 500);
            
            setTimeout(() => {
                addMessage('System', 'Shelves lined with colorful bottles and dried herbs surround you. The air hums with magical energy.');
            }, 2000);
            
            setTimeout(() => {
                addMessage('Apothecary', '🧪 *A soft voice calls from behind bubbling cauldrons*');
            }, 3500);
        };

        // Periodic ambient sounds
        setInterval(() => {
            if (Math.random() < 0.3) { // 30% chance every interval
                const randomSound = ambientSounds[Math.floor(Math.random() * ambientSounds.length)];
                addMessage('Apothecary', randomSound);
            }
        }, 15000); // Every 15 seconds

        // Focus input on page load
        document.getElementById('messageInput').focus();
        // Initialize
        (async function(){
            const ok = await ensurePlayer();
            if (!ok) return;
            addMessage('System', 'You enter Elara\'s apothecary. The air smells of herbs.');
        })();
    </script>
</body>
</html>
