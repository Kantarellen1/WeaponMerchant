<!DOCTYPE html>
<html>
<head>
    <title>Gerik's Smithy - Weapons & Armor</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
        }
        .smithy-container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px;
            background: rgba(0,0,0,0.3);
            min-height: 100vh;
        }
        .smithy-header { 
            text-align: center; 
            margin-bottom: 30px;
            background: rgba(139,69,19,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .chat-box { 
            border: 3px solid #654321; 
            padding: 20px; 
            margin: 20px 0; 
            height: 400px; 
            overflow-y: scroll; 
            background: rgba(255,248,220,0.95);
            color: #333;
            border-radius: 10px;
        }
        .anvil-sound { 
            background: #ffeb3b; 
            padding: 5px 10px; 
            border-radius: 5px; 
            font-size: 12px; 
            color: #333;
            margin: 5px 0;
        }
        .purchase-panel {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 20px 0;
            padding: 16px;
            border: 2px solid #c58b45;
            border-radius: 8px;
            background: rgba(255,248,220,0.96);
            color: #333;
        }
        .purchase-details { display: grid; gap: 4px; }
        .purchase-details strong { color: #654321; }
        .purchase-button {
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            background: #654321;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .purchase-button:disabled { opacity: 0.55; cursor: not-allowed; }
        .purchase-status { margin: 8px 0 0; font-size: 14px; }
        /* Rest of your styling... */
    </style>
</head>
<body>
    <div class="smithy-container">
        <div class="smithy-header">
            <h1>🔨 Gerik's Smithy 🔨</h1>
            <p>*The sound of hammer on anvil echoes through the shop*</p>
            <p>"Welcome to the finest weaponry in all of Edvin!"</p>
        </div>
        
        <div class="anvil-sound">🔥 *Clang clang* The forge burns bright today... 🔥</div>
        
        <div class="chat-box" id="chatBox"></div>

        <div class="purchase-panel" id="purchasePanel">
            <div class="purchase-details">
                <strong id="purchaseItemName"></strong>
                <span id="purchasePrice"></span>
                <span id="purchaseGold"></span>
                <span class="purchase-status" id="purchaseStatus"></span>
            </div>
            <button class="purchase-button" id="purchaseButton" onclick="buySelectedItem()">Buy</button>
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Speak to Gerik..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Talk</button>
            <button onclick="window.location.href='/town'">Leave Smithy</button>
        </div>
    </div>

    <script>
        let playerId = null;
        const merchantId = 'gerik';
        const sessionKey = 'weapon_merchant_session';
        let selectedItemKey = null;

        const itemAliases = [
            { key: 'long_sword', name: 'Longsword', terms: ['longsword', 'long sword', 'iron sword'] },
            { key: 'shortsword', name: 'Shortsword', terms: ['shortsword', 'short sword'] },
            { key: 'battle_axe', name: 'Battle Axe', terms: ['battle axe'] },
            { key: 'dagger', name: 'Dagger', terms: ['dagger'] },
            { key: 'wooden_shield', name: 'Wooden Shield', terms: ['wooden shield'] },
            { key: 'iron_shield', name: 'Iron Shield', terms: ['iron shield'] },
            { key: 'leather_armor', name: 'Leather Armor', terms: ['leather armor'] },
            { key: 'chainmail', name: 'Chainmail', terms: ['chainmail'] },
            { key: 'plate_armor', name: 'Plate Armor', terms: ['plate armor'] }
        ];

        async function ensurePlayer() {
            const token = localStorage.getItem(sessionKey);
            if (!token) { location.href = '/login'; return false; }
            const res = await fetch(`/player/profile?session_token=${encodeURIComponent(token)}`);
            const data = await res.json();
            if (!res.ok || !data.player_id) { localStorage.removeItem(sessionKey); location.href = '/login'; return false; }
            playerId = data.player_id;
            addMessage('System', `You are logged in as ${playerId}.`);
            return true;
        }
        
        // Smithy-specific functionality
        function addMessage(sender, message) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender.toLowerCase();

            const label = document.createElement('strong');
            label.textContent = sender === 'Merchant' ? '🔨 Gerik: ' : `${sender}: `;
            messageDiv.appendChild(label);

            if (sender === 'Merchant') {
                messageDiv.appendChild(document.createTextNode(message));
            } else {
                messageDiv.appendChild(document.createTextNode(message));
            }
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function findRequestedItem(message) {
            const normalized = message.toLowerCase();
            return itemAliases.find(item => item.terms.some(term => normalized.includes(term)));
        }

        async function showPurchasePanel(item) {
            selectedItemKey = item.key;
            const panel = document.getElementById('purchasePanel');
            const button = document.getElementById('purchaseButton');
            document.getElementById('purchaseItemName').textContent = item.name;
            document.getElementById('purchasePrice').textContent = 'Checking price...';
            document.getElementById('purchaseGold').textContent = '';
            document.getElementById('purchaseStatus').textContent = '';
            button.disabled = true;
            panel.style.display = 'flex';

            const response = await fetch('/merchant/quote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_token: localStorage.getItem(sessionKey),
                    item_key: item.key,
                    quantity: 1,
                    town: 'Edvin'
                })
            });
            const quote = await response.json();
            if (quote.error || quote.message) {
                document.getElementById('purchaseStatus').textContent = quote.error || quote.message;
                return;
            }

            document.getElementById('purchasePrice').textContent = `${quote.unit_price} gold`;
            document.getElementById('purchaseGold').textContent = `You have ${quote.player_gold} gold`;
            button.disabled = !quote.affordable;
            if (!quote.affordable) {
                document.getElementById('purchaseStatus').textContent = 'Not enough gold.';
            }
        }

        async function buySelectedItem() {
            if (!selectedItemKey) return;
            const button = document.getElementById('purchaseButton');
            const status = document.getElementById('purchaseStatus');
            button.disabled = true;
            status.textContent = 'Completing purchase...';

            const response = await fetch('/merchant/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_token: localStorage.getItem(sessionKey),
                    item_key: selectedItemKey,
                    quantity: 1,
                    town: 'Edvin'
                })
            });
            const result = await response.json();
            status.textContent = result.message;
            if (result.purchase) {
                document.getElementById('purchaseGold').textContent = `You have ${result.gold} gold`;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            const requestedItem = findRequestedItem(message);

            addMessage('You', message);
            input.value = '';

            try {
                const token = localStorage.getItem(sessionKey);
                const response = await fetch("/talk_to_merchant", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                            player_id: playerId,
                            session_token: token,
                            message: message,
                            player_location: "Edvin",
                            shop_type: "smithy"
                        })
                });

                const data = await response.json();
                // Display the merchant's reply in the chat box
                addMessage('Merchant', data.response);
                if (requestedItem) showPurchasePanel(requestedItem);

                
                if (Math.random() < 0.3) {
                    setTimeout(() => {
                        const sounds = ['*clang clang*', '*hiss of hot metal*', '*bellows whoosh*'];
                        addMessage('Smithy', sounds[Math.floor(Math.random() * sounds.length)]);
                    }, 2000);
                }
            } catch (error) {
                addMessage('System', 'Error: ' + error.message);
            }
        }

        // Initialize
        (async function(){
            const ok = await ensurePlayer();
            if (!ok) return;
            addMessage('System', 'You step into the warm, smoky smithy. Gerik looks up from his anvil with a smile.');
        })();
    </script>
</body>
</html>
