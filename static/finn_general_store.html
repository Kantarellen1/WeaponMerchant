<!DOCTYPE html>
<html>
<head>
    <title>Finn's General Store - Supplies & Tools</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #8B4513 0%, #CD853F 100%);
            color: white;
        }
        .store-container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px;
            background: rgba(0,0,0,0.3);
            min-height: 100vh;
        }
        .store-header { 
            text-align: center; 
            margin-bottom: 30px;
            background: rgba(139,69,19,0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .market-sound { 
            background: #fff8dc; 
            padding: 5px 10px; 
            border-radius: 5px; 
            font-size: 12px; 
            color: #333;
            margin: 5px 0;
        }
        .chat-box { 
            border: 3px solid #8B4513; 
            padding: 20px; 
            margin: 20px 0; 
            height: 400px; 
            overflow-y: scroll; 
            background: rgba(255,248,220,0.95);
            color: #333;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(139,69,19,0.3);
        }
        .message { 
            margin: 10px 0; 
            padding: 8px; 
            border-radius: 5px; 
        }
        .you { 
            color: #000080; 
            background: #e6f3ff; 
            border-left: 4px solid #4169E1;
        }
        .merchant { 
            color: #8B4513; 
            background: #fff8dc; 
            font-weight: bold; 
            border-left: 4px solid #8B4513;
        }
        .system { 
            color: #666; 
            font-style: italic; 
            background: #f5f5f5;
            border-left: 4px solid #999;
        }
        .marketplace { 
            color: #CD853F; 
            background: #faebd7; 
            font-size: 12px;
            text-align: center;
            border: 1px dashed #8B4513;
        }
        .input-area { 
            display: flex; 
            gap: 10px; 
            margin-top: 10px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 12px; 
            font-size: 16px; 
            border: 3px solid #8B4513; 
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
        }
        button { 
            padding: 12px 20px; 
            font-size: 16px; 
            background: #8B4513; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { 
            background: #A0522D; 
        }
        .leave-btn {
            background: #654321;
        }
        .leave-btn:hover {
            background: #8B4513;
        }
        .purchase-panel {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 20px 0;
            padding: 16px;
            border: 2px solid #CD853F;
            border-radius: 8px;
            background: rgba(255,248,220,0.96);
            color: #333;
        }
        .purchase-details { display: grid; gap: 4px; }
        .purchase-details strong { color: #8B4513; }
        .purchase-button { padding: 10px 16px; background: #8B4513; color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .purchase-button:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="store-container">
        <div class="store-header">
            <h1>📦 Finn's General Store 📦</h1>
            <p>*The bustling marketplace filled with everything an adventurer needs*</p>
            <p>"I've got what you need, and what you didn't know you needed!"</p>
        </div>
        
        <div class="market-sound">🛒 *Rustle rustle* Finn rearranges his wares... 📋</div>
        
        <div class="chat-box" id="chatBox"></div>

        <div class="purchase-panel" id="purchasePanel">
            <div class="purchase-details">
                <strong id="purchaseItemName"></strong>
                <span id="purchasePrice"></span>
                <span id="purchaseGold"></span>
                <span id="purchaseStatus"></span>
            </div>
            <button class="purchase-button" id="purchaseButton" onclick="buySelectedItem()">Buy</button>
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Speak to Finn..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Talk</button>
            <button class="leave-btn" onclick="window.location.href='/town'">Leave Store</button>
        </div>
    </div>

    <script>
        let playerId = null;
        const merchantId = 'finn';
        const sessionKey = 'weapon_merchant_session';
        let selectedItemKey = null;
        const itemAliases = [
            { key: 'potion_small', name: 'Small Potion', terms: ['small potion', 'potion'] }
        ];

        async function ensurePlayer() {
            const token = localStorage.getItem(sessionKey);
            if (!token) { location.href = '/login'; return false; }
            const res = await fetch(`/player/profile?session_token=${encodeURIComponent(token)}`);
            const data = await res.json();
            if (!res.ok || !data.player_id) { localStorage.removeItem(sessionKey); location.href = '/login'; return false; }
            playerId = data.player_id;
            addMessage('System', `You are logged in as ${playerId}.`);
            return true;
        }
        
        // Marketplace ambient sounds
        const ambientSounds = [
            '📋 *Scribble scribble* Finn updates his inventory list...',
            '🛒 *Clatter* Tools shift as Finn organizes his shelves...',
            '📦 *Thump* A new crate arrives from the trade routes...',
            '🔔 *Jingle* The shop bell rings as someone passes by...',
            '🪙 *Clink clink* Finn counts coins in his cash box...',
            '📜 *Rustle* Trade documents flutter in the breeze...'
        ];

        function addMessage(sender, message) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender.toLowerCase().replace(' ', '-');
            
            if (sender === 'Merchant') {
                messageDiv.innerHTML = `<strong>🛒 Finn:</strong> ${message}`;
            } else if (sender === 'Marketplace') {
                messageDiv.innerHTML = message;
            } else {
                messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            }
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function findRequestedItem(message) {
            const normalized = message.toLowerCase();
            return itemAliases.find(item => item.terms.some(term => normalized.includes(term)));
        }

        async function showPurchasePanel(item) {
            selectedItemKey = item.key;
            const panel = document.getElementById('purchasePanel');
            const button = document.getElementById('purchaseButton');
            document.getElementById('purchaseItemName').textContent = item.name;
            document.getElementById('purchasePrice').textContent = 'Checking price...';
            document.getElementById('purchaseGold').textContent = '';
            document.getElementById('purchaseStatus').textContent = '';
            button.disabled = true;
            panel.style.display = 'flex';
            const response = await fetch('/merchant/quote', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_token: localStorage.getItem(sessionKey), merchant_id: merchantId, item_key: item.key, quantity: 1, town: 'Edvin' })
            });
            const quote = await response.json();
            if (quote.error || quote.message) {
                document.getElementById('purchaseStatus').textContent = quote.error || quote.message;
                return;
            }
            document.getElementById('purchasePrice').textContent = `${quote.unit_price} gold`;
            document.getElementById('purchaseGold').textContent = `You have ${quote.player_gold} gold`;
            button.disabled = !quote.affordable;
            if (!quote.affordable) document.getElementById('purchaseStatus').textContent = 'Not enough gold.';
        }

        async function buySelectedItem() {
            if (!selectedItemKey) return;
            const button = document.getElementById('purchaseButton');
            const status = document.getElementById('purchaseStatus');
            button.disabled = true;
            status.textContent = 'Completing purchase...';
            const response = await fetch('/merchant/buy', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_token: localStorage.getItem(sessionKey), merchant_id: merchantId, item_key: selectedItemKey, quantity: 1, town: 'Edvin' })
            });
            const result = await response.json();
            status.textContent = result.message;
            if (result.purchase) document.getElementById('purchaseGold').textContent = `You have ${result.gold} gold`;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            const requestedItem = findRequestedItem(message);

            addMessage('You', message);
            input.value = '';

            try {
                const token = localStorage.getItem(sessionKey);
                const response = await fetch(`/talk_to_merchant`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        player_id: playerId,
                        session_token: token,
                        message: message,
                        player_location: "Edvin",
                        shop_type: "market"
                    })
                });

                const data = await response.json();
                addMessage('Merchant', data.response);
                if (requestedItem) showPurchasePanel(requestedItem);

                // Ambient and special effects (unchanged)
                if (Math.random() < 0.35) {
                    setTimeout(() => {
                        const randomSound = ambientSounds[Math.floor(Math.random() * ambientSounds.length)];
                        addMessage('Marketplace', randomSound);
                    }, 1000 + Math.random() * 2500);
                }
                if (message.toLowerCase().includes('price') || message.toLowerCase().includes('deal') || message.toLowerCase().includes('trade')) {
                    setTimeout(() => {
                        addMessage('Marketplace', '💰 *Finn\'s eyes light up at the mention of business...*');
                    }, 2500);
                }
                if (message.toLowerCase().includes('rope') || message.toLowerCase().includes('tool') || message.toLowerCase().includes('supplies')) {
                    setTimeout(() => {
                        addMessage('Marketplace', '🔨 *Finn eagerly searches through his packed shelves...*');
                    }, 2000);
                }
            } catch (error) {
                addMessage('System', 'Error: ' + error.message);
            }
        }

        // Initialize
        (async function(){
            const ok = await ensurePlayer();
            if (!ok) return;
            addMessage('System', 'You step into Finn\'s busy stall.');
        })();

        // Initialize with atmospheric entry
        window.onload = function() {
            setTimeout(() => {
                addMessage('System', 'You push through the crowded marketplace and approach Finn\'s well-stocked stall...');
            }, 500);
            
            setTimeout(() => {
                addMessage('System', 'Shelves overflow with rope, tools, rations, and countless useful items. Finn looks up with a shrewd smile.');
            }, 2000);
            
            setTimeout(() => {
                addMessage('Marketplace', '📦 *A merchant\'s keen eyes size you up for potential business*');
            }, 3500);
        };

        // Periodic ambient sounds
        setInterval(() => {
            if (Math.random() < 0.25) { // 25% chance every interval
                const randomSound = ambientSounds[Math.floor(Math.random() * ambientSounds.length)];
                addMessage('Marketplace', randomSound);
            }
        }, 18000); // Every 18 seconds

        // Focus input on page load
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
